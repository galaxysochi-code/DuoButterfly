name: DuoButterfly
options:
  bundleIdPrefix: local.duobutterfly
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_DEBUG_DYLIB: NO
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "23"
targets:
  DuoButterfly:
    type: application
    platform: macOS
    sources:
      - path: DuoButterfly
        excludes:
          - FoldShaders.metal.txt
      - path: DuoButterfly/FoldShaders.metal.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DuoButterfly
        PRODUCT_BUNDLE_IDENTIFIER: local.duobutterfly.DuoButterfly
        INFOPLIST_FILE: DuoButterfly/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: IOKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: Carbon.framework
  DuoButterflyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DuoButterflyTests
    dependencies:
      - target: DuoButterfly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DuoButterfly.app/Contents/MacOS/DuoButterfly"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DuoButterfly:
    build:
      targets:
        DuoButterfly: all
    test:
      targets:
        - DuoButterflyTests
